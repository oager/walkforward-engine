[project]
name = "walkforward-engine"
version = "0.1.0"
description = "Bot-agnostic walk-forward analysis engine with out-of-sample survival gating"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
    "optuna>=3.6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wfa*", "portal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
