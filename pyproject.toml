[project]
name = "walkforward-engine"
version = "0.1.0"
description = "Bot-agnostic walk-forward analysis engine with out-of-sample survival gating"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
    "optuna>=3.6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wfa*", "portal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Mechanical, low-risk rule set: pycodestyle/pyflakes errors, import
# sorting, and pyupgrade. Behavioural rules are intentionally left out —
# see the scope note in the linting issue.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts insert the repo root into sys.path before importing wfa.*,
# so module-level imports can't all sit at the top of the file.
"scripts/*" = ["E402"]
